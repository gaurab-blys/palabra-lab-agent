<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palabra Lab — Agent</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.35rem;
        padding: 0.65rem;
        font-size: 1rem;
      }
      button {
        cursor: pointer;
        margin-top: 1rem;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 0.5rem;
      }
      .row button {
        flex: 1;
        margin-top: 0.5rem;
      }
      button.secondary {
        background: #fff;
        border: 1px solid #ccc;
      }
      button.muted {
        background: #1f2937;
        color: #fff;
        border-color: #1f2937;
      }
      #status {
        margin-top: 1rem;
        padding: 0.75rem;
        background: #f4f4f4;
        border-radius: 6px;
        min-height: 3rem;
      }
      .hint {
        color: #555;
        font-size: 0.9rem;
        margin-top: 1.5rem;
      }
    </style>
    <script src="/vendor/twilio.min.js"></script>
  </head>
  <body>
    <h1>Palabra Lab Agent</h1>
    <p>
      Speak in the browser (mic via Twilio). Client translations play
      <strong>here in the page</strong> — not on the Twilio call leg.
    </p>

    <label for="caller">Caller number (Twilio)</label>
    <input id="caller" type="tel" placeholder="+19189194048" />

    <label for="client">Client number</label>
    <input id="client" type="tel" placeholder="+9779702005057" />

    <button id="callBtn" type="button" disabled>Call client</button>
    <button id="hangupBtn" type="button" disabled>Hang up</button>

    <div class="row">
      <button id="muteBtn" class="secondary" type="button" disabled>Mute mic</button>
      <button id="interruptBtn" class="secondary" type="button" disabled>
        Interrupt Palabra
      </button>
    </div>

    <div id="status">Loading…</div>

    <p class="hint">
      Architecture: agent Twilio stream = mic only. Peer TTS →
      <code>/agent-playback</code> → Web Audio. Client PSTN still gets Twilio media inject.
    </p>

    <script>
      const Device = Twilio.Device;

      const statusEl = document.getElementById('status');
      const callBtn = document.getElementById('callBtn');
      const hangupBtn = document.getElementById('hangupBtn');
      const muteBtn = document.getElementById('muteBtn');
      const interruptBtn = document.getElementById('interruptBtn');
      const callerInput = document.getElementById('caller');
      const clientInput = document.getElementById('client');

      const params = new URLSearchParams(window.location.search);
      if (params.get('caller')) callerInput.value = params.get('caller');
      if (params.get('client')) clientInput.value = params.get('client');

      let device;
      let activeCall;
      let playbackWs;
      let bindTimer;
      let audioCtx;
      let nextPlayTime = 0;

      /** μ-law byte → linear PCM float in [-1, 1] */
      const mulawToFloat = (mu) => {
        const MULAW_MAX = 0x1fff;
        const u = ~mu & 0xff;
        const sign = u & 0x80;
        const exponent = (u >> 4) & 0x07;
        const mantissa = u & 0x0f;
        let sample = ((mantissa << 3) + 0x84) << exponent;
        sample -= 0x84;
        if (sign) sample = -sample;
        return sample / (MULAW_MAX + 1);
      };

      const ensureAudio = async () => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: 8000,
          });
        }
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        return audioCtx;
      };

      const playMulawBase64 = async (b64) => {
        const ctx = await ensureAudio();
        const raw = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        const frames = raw.length;
        const buffer = ctx.createBuffer(1, frames, 8000);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < frames; i += 1) data[i] = mulawToFloat(raw[i]);

        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        const startAt = Math.max(ctx.currentTime + 0.01, nextPlayTime);
        src.start(startAt);
        nextPlayTime = startAt + buffer.duration;
      };

      const stopPlaybackSocket = () => {
        if (bindTimer) {
          clearInterval(bindTimer);
          bindTimer = null;
        }
        if (playbackWs) {
          try {
            playbackWs.close();
          } catch (_e) {}
          playbackWs = null;
        }
        nextPlayTime = 0;
      };

      const sendBind = () => {
        if (!playbackWs || playbackWs.readyState !== WebSocket.OPEN) return;
        playbackWs.send(
          JSON.stringify({
            event: 'bind',
            from: callerInput.value.trim(),
            to: clientInput.value.trim(),
          })
        );
      };

      const startPlaybackSocket = () => {
        stopPlaybackSocket();
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        playbackWs = new WebSocket(proto + '//' + location.host + '/agent-playback');

        playbackWs.onopen = () => {
          sendBind();
          bindTimer = setInterval(sendBind, 500);
        };

        playbackWs.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (_e) {
            return;
          }
          if (msg.event === 'bound') {
            if (bindTimer) {
              clearInterval(bindTimer);
              bindTimer = null;
            }
            setStatus('Playback bound — speak after client answers.');
            return;
          }
          if (msg.event === 'audio' && msg.payload) {
            playMulawBase64(msg.payload).catch((err) =>
              console.warn('playback failed', err)
            );
          }
        };

        playbackWs.onclose = () => {
          playbackWs = null;
        };
      };

      const setStatus = (msg) => {
        statusEl.textContent = msg;
      };

      const setInCall = (on) => {
        callBtn.disabled = on;
        hangupBtn.disabled = !on;
        muteBtn.disabled = !on;
        interruptBtn.disabled = !on;
        if (!on) {
          muteBtn.textContent = 'Mute mic';
          muteBtn.classList.remove('muted');
        }
      };

      const setupDevice = async () => {
        const res = await fetch('/api/voice-token');
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          setStatus(
            err.error ||
              'Voice token failed — set TWILIO_API_KEY, TWILIO_API_SECRET, TWILIO_VOICE_TWIML_APP_SID'
          );
          return;
        }

        const { token } = await res.json();
        device = new Device(token, { closeProtection: true });

        device.on(Device.EventName.Registered, () => {
          setStatus('Ready — click Call client.');
          callBtn.disabled = false;
        });

        device.on(Device.EventName.Error, (err) => {
          setStatus('Device error: ' + err.message);
        });

        device.register();
      };

      callBtn.addEventListener('click', async () => {
        const From = callerInput.value.trim();
        const To = clientInput.value.trim();
        if (!From || !To) {
          setStatus('Enter both numbers.');
          return;
        }
        setStatus('Connecting…');
        try {
          await ensureAudio();
          startPlaybackSocket();
          activeCall = await device.connect({ params: { To, From } });
          setInCall(true);
          setStatus('Connected — client ringing. Translations play in this page.');
          activeCall.on('disconnect', () => {
            activeCall = null;
            setInCall(false);
            stopPlaybackSocket();
            setStatus('Call ended.');
          });
        } catch (err) {
          stopPlaybackSocket();
          setStatus('Connect failed: ' + err.message);
        }
      });

      hangupBtn.addEventListener('click', () => {
        if (activeCall) activeCall.disconnect();
        stopPlaybackSocket();
      });

      muteBtn.addEventListener('click', () => {
        if (!activeCall) return;
        const next = !activeCall.isMuted();
        activeCall.mute(next);
        muteBtn.textContent = next ? 'Unmute mic' : 'Mute mic';
        muteBtn.classList.toggle('muted', next);
        setStatus(
          next
            ? 'Mic muted — Palabra should stop getting your English.'
            : 'Mic unmuted.'
        );
      });

      interruptBtn.addEventListener('click', async () => {
        if (!activeCall) return;
        interruptBtn.disabled = true;
        try {
          const res = await fetch('/debug/drop-palabra', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setStatus('Interrupt failed: ' + (data.error || res.status));
            return;
          }
          if (!data.dropped || !data.dropped.length) {
            setStatus('No Palabra session to interrupt yet (wait for the media stream).');
            return;
          }
          setStatus(
            'Palabra interrupted — watch logs for reconnect or fail-open. Call stays up.'
          );
        } catch (err) {
          setStatus('Interrupt failed: ' + err.message);
        } finally {
          interruptBtn.disabled = !activeCall;
        }
      });

      setupDevice().catch((err) => setStatus(err.message));
    </script>
  </body>
</html>
